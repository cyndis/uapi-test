[package]
name = "uapi-test"
version = "0.2.0"
authors = ["Mikko Perttunen <cyndis@kapsi.fi>"]
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["ioctl"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1"
inventory = "0.3"

[profile.release]
debug = 2
