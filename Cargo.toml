[package]
name = "uapi-test"
version = "0.2.0"
authors = ["Mikko Perttunen <cyndis@kapsi.fi>"]
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["ioctl"] }
structopt = { version = "0.3", default-features = false }
memmap = "0.7"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = 2
